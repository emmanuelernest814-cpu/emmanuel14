<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>
</head>
<body>
<form style="width:300px; padding:20px; border:3px solid red; border-radius:30px; margin:50px auto;">
    <input type="number" style="width:270px; height:70px; font-size:20px; border:2px solid blue; border-radius:15px; margin-bottom:20px;">
    <br><br>
    <input type="button" value="1" style="width:60px; height:50px;">
    <input type="button" value="2" style="width:60px; height:50px;">
    <input type="button" value="3" style="width:60px; height:50px;">
    <input type="button" value="÷" style="width:60px; height:50px;">
    <br><br>
    <input type="button" value="4" style="width:60px; height:50px;">
    <input type="button" value="5" style="width:60px; height:50px;">
    <input type="button" value="6" style="width:60px; height:50px;">
    <input type="button" value="-" style="width:60px; height:50px;">
    <br><br>
    <input type="button" value="7" style="width:60px; height:50px;">
    <input type="button" value="8" style="width:60px; height:50px;">
    <input type="button" value="9" style="width:60px; height:50px;">
    <input type="button" value="×" style="width:60px; height:50px;">

    <br><br>
    <label for="button">
        <input type="reset" value="clear" style="width:125px; height:50px;">
    </label>
    <input type="button" value="=" style="width:60px; height:50px;">
    <input type="button" value="+" style="width:60px; height:50px;">
    <input type="button" value="b" style="width:60px; height:50px;">
</form>
</body>
</html>
